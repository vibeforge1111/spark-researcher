name: Spark shared CI

on:
  push:
    branches:
      - main
      - "codex/**"
      - "reconcile/**"
      - "ap-01-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  conformance:
    uses: vibeforge1111/spark-cli/.github/workflows/reusable-conformance.yml@ap-01-reusable-ci-v4
    with:
      python-version: "3.11"
      install-command: "python -m pip install -e . pytest"
      test-command: ""
      conformance-command: "python -c \"import spark_researcher.cli; print('Spark researcher CLI is importable.')\""

  scanners:
    uses: vibeforge1111/spark-cli/.github/workflows/reusable-scanners.yml@ap-01-reusable-ci-v4
